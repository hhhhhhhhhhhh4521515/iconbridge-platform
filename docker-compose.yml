# Local development services. Start with `pnpm infra:up` (or `pnpm dev`).
# Variables come from the root .env; every one has a default (see .env.example).
name: iconbridge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iconbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iconbridge}
      POSTGRES_DB: ${POSTGRES_DB:-iconbridge}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    restart: unless-stopped
    # --skipApiVersionCheck: the Azure SDK is often one API version ahead of the emulator.
    # --disableProductStyleUrl: the account is always the first segment of the path, also
    # when the host name has dots (azurite.localhost below).
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck --disableProductStyleUrl
    ports:
      - '127.0.0.1:${AZURITE_BLOB_PORT:-10000}:10000'
    volumes:
      - azurite-data:/data
    networks:
      default:
        # The production images (docker-compose.prod.yml) reach Azurite under this name, and
        # so does the browser: every *.localhost name leads to 127.0.0.1, where port 10000 is
        # published. Download links signed by the API then work on both sides.
        aliases: [azurite.localhost]
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 10000']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-2525}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ['tools']
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@iconbridge.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/misc/ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  azurite-data:
  pgadmin-data:
