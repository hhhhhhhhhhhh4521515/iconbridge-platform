packages:
  - apps/*
  - packages/*

# Single version for tools shared by every workspace.
# TypeScript stays on 6.0.x: typescript-eslint and the Nest CLI do not support 7 yet.
# ESLint stays on 9.x: the plugins bundled in eslint-config-next do not support 10 yet.
catalog:
  typescript: ~6.0.3
  zod: ^4.6.7
  vitest: ^5.0.4
  eslint: ^9.39.5
  '@types/node': ^22.20.5

# Dependencies allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  argon2: true
  '@nestjs/core': false
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Patched versions of indirect dependencies with known vulnerabilities (pnpm audit, trivy).
# Remove an entry once the package that brings it in depends on a fixed version itself.
overrides:
  'exceljs>uuid': ^11.1.1
  mysql2: ^3.23.1
  deepmerge-ts: ^8.0.0
