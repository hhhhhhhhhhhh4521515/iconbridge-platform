name: Setup
description: Node 22, pnpm, the dependencies, the Turborepo cache and the local .env files.
runs:
  using: composite
  steps:
    # The version comes from "packageManager" in package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    # Turborepo's local cache: unchanged packages are not built or tested again.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
    # The same local values as on a workstation (.env.example files); local secrets
    # are generated, never taken from GitHub.
    - name: Local .env files
      shell: bash
      run: pnpm env:init
