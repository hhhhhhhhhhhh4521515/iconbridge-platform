version: 2
updates:
  # pnpm workspace: one pull request per week for the minor and patch updates.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: terraform
    directories: [/infra/terraform/bootstrap, /infra/terraform/envs/prod, /infra/terraform/github]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
